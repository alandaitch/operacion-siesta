<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0a09" />
    <!-- An inline favicon, purely so the browser stops requesting /favicon.ico and putting a 404
         in every automated run's console-error list. No network at runtime (CONTRACTS §1.3). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0a09'/%3E%3Ccircle cx='16' cy='13' r='7' fill='%23e8c9a8'/%3E%3Ccircle cx='13' cy='13' r='1.6' fill='%232a1a10'/%3E%3Ccircle cx='19' cy='13' r='1.6' fill='%232a1a10'/%3E%3Cpath d='M12 19q4 3 8 0' stroke='%232a1a10' stroke-width='1.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>OPERATION NAPTIME</title>
    <meta
      name="description"
      content="A photoreal first-person game where you are a baby wrecking a living room before you get caught."
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #070605;
        font-family: ui-sans-serif, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        touch-action: none;
        overscroll-behavior: none;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        cursor: none;
      }
      #ui-root {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      /* --- boot screen (owned by the integrator; menus.js takes over once loaded) --- */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 42%, #191512 0%, #0a0807 62%, #050403 100%);
        transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      .boot-inner {
        text-align: center;
        transform: translateY(-4vh);
      }
      .boot-title {
        font-size: clamp(28px, 6.2vw, 74px);
        font-weight: 200;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        color: #f4ece1;
        line-height: 1;
      }
      .boot-title b {
        font-weight: 700;
      }
      .boot-sub {
        margin-top: 18px;
        font-size: clamp(9px, 1.1vw, 12px);
        letter-spacing: 0.55em;
        text-indent: 0.55em;
        text-transform: uppercase;
        color: #9c8e7d;
      }
      .boot-bar {
        margin: 46px auto 0;
        width: min(340px, 62vw);
        height: 1px;
        background: #2b2521;
        position: relative;
        overflow: hidden;
      }
      .boot-bar i {
        position: absolute;
        inset: 0 100% 0 0;
        background: linear-gradient(90deg, #6b5b4a, #e8c89a);
        transition: right 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .boot-step {
        margin-top: 14px;
        height: 12px;
        font-size: 10px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #6b6157;
      }
      .boot-err {
        margin-top: 22px;
        max-width: 70ch;
        font-size: 12px;
        line-height: 1.6;
        color: #d98b6a;
        white-space: pre-wrap;
        text-align: left;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot,
        .boot-bar i {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui-root"></div>

    <div id="boot">
      <div class="boot-inner">
        <div class="boot-title">OPERATION <b>NAPTIME</b></div>
        <div class="boot-sub">Living room incident &nbsp;·&nbsp; 17:34</div>
        <div class="boot-bar"><i id="boot-fill"></i></div>
        <div class="boot-step" id="boot-step">initialising</div>
        <div class="boot-err" id="boot-err"></div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
